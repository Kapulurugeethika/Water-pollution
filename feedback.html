<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2>💧 Clean Water Mission</h2>

        <a href="index.html">Home</a>

<section class="content">
    <h1>Share Your Feedback</h1>
    <p>Your suggestions help us improve environmental awareness.</p>

    <form id="feedbackForm">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Your Feedback</label>
        <textarea id="message" placeholder="Write your suggestions..." required></textarea>

        <button type="submit" class="btn">Submit Feedback</button>
    </form>

    <p id="response"></p>
</section>

<footer>© 2026 Water Pollution Awareness Project</footer>
<script src="script.js"></script>
</body>
</html>
